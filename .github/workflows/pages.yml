name: Publish main and dev to GitHub Pages

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: main
          path: production

      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: dev
          path: development

      - name: Assemble site
        run: |
          mkdir -p public
          git -C production archive HEAD | tar -x -C public
          rm -rf public/dev public/.github
          mkdir -p public/dev
          git -C development archive HEAD | tar -x -C public/dev
          rm -rf public/dev/.github
          touch public/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4